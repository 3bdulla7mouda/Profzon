<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>بروفزون - اتصل بنا</title>
    <style>
       * {
    box-sizing: border-box;
    max-width: 100%; /* تمنع أي عنصر إنه يخرج بره عرض الشاشة */
} img {
    max-width: 100%;
    height: auto; /* عشان الصورة متتمطش */
    display: block;
}
        textarea {
    border: 1px solid #31cce8 !important;
    border-radius: 8px;
    margin-bottom: 20px;
    outline: none;
}
textarea:focus {
    box-shadow: 0 0 10px #00ff00;
}
/* تنسيق حقول الإدخال والرسالة *//* هذا الكود سيجبر العناصر على التكبر وتوضيح الخط */
input, textarea {
    color: #000000 !important; /* لون الخط أسود غامق جداً */
    background-color: #eeefe8 !important; /* خلفية بيضاء صريحة */
    font-size: 20px !important; /* تكبير الخط جداً */
    padding: 15px !important; /* مساحة واسعة حول النص */
    border: 2px solid #333 !important; /* إطار واضح للحقول */
    width: 70% !important; /* عرض كامل */
    display: block !important;
    margin: 10px 0 !important;
    opacity: 1 !important; /* التأكد من أنها ليست شفافة */
}

/* لتوسيع منطقة الرسالة تحديداً */
textarea {
    min-height: 200px !important; 
}
}

/* تكبير زر الإرسال */
button, .send-btn {
    padding: 12px 30px;
    font-size: 18px;
    cursor: pointer;
    background-color: #00ff88; /* لون متناسق مع تصميمك */
    border: none;
    border-radius: 5px;
    font-weight: bold;
}
.social-links {
    margin-top: 20px;
    display: flex;
    gap: 20px;
    justify-content: center; /* لتوسيط الأيقونات */
}

.social-links a {
    font-size: 30px; /* تكبير حجم الأيقونات */
    transition: transform 0.3s ease, color 0.3s ease;
    text-decoration: none;
}

/* لون فيسبوك */
.social-links a .fa-facebook { color: #1877F2; }

/* لون انستجرام */
.social-links a .fa-instagram { color: #E4405F; }

/* لون البريد */
.social-links a .fa-envelope { color: #333; }

/* تأثير عند تمرير الماوس */
.social-links a:hover {
    transform: scale(1.2); /* تكبير بسيط عند الوقوف بالماوس */
}

    </style>
    <link rel="stylesheet" href="style.css"> <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="login-card"> <h2><i class="fas fa-headset"></i> اتصل بنا</h2>
        
        <form id="contactForm" class="login-form">
            
            <div class="input-group">
                <input type="text" id="contactName" placeholder="اسمك الكريم" required>
                <i class="fas fa-user"></i>
            </div>

            <div class="input-group">
                <input type="email" id="contactEmail" placeholder="بريدك الإلكتروني" required>
                <i class="fas fa-envelope"></i>
            </div>

            <div class="input-group">
                <textarea id="contactMessage" placeholder="اكتب رسالتك هنا..." required style="width: 100%; height: 100px; background: transparent; border: none; color: white; padding: 10px; resize: none;"></textarea>
                <i class="fas fa-comment-dots"></i>
            </div>

            <button type="submit" class="login-btn">إرسال الرسالة</button>
        </form>

        <p class="signup-link"><a href="index.html">العودة للرئيسية</a></p>
    </div>
<div class="social-links">
    <a href="https://www.facebook.com/share/1BwiEaMKfb/" target="_blank" title="Facebook">
        <i class="fab fa-facebook"></i>
    </a>
    
    <a href="https://www.instagram.com/abdulla7mouda?igsh=cjBwMGF0aGpyb2ky" target="_blank" title="Instagram">
        <i class="fab fa-instagram"></i>
    </a>
    
    <a href="mailto:3bdulla7mouda@gmail.com" title="Email">
        <i class="fas fa-envelope"></i>
    </a>
</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyALdyY3rvNsQI9UVue6BUNdU0EhR-FSdks",
            authDomain: "profzon-384de.firebaseapp.com",
            projectId: "profzon-384de",
            storageBucket: "profzon-384de.firebasestorage.app",
            messagingSenderId: "611549560606",
            appId: "1:611549560606:web:d331008d3534aca157130f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const contactForm = document.getElementById('contactForm');
        contactForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            try {
                await addDoc(collection(db, "messages"), {
                    name: document.getElementById('contactName').value,
                    email: document.getElementById('contactEmail').value,
                    message: document.getElementById('contactMessage').value,
                    date: new Date().toLocaleString()
                });
                alert("تم إرسال رسالتك بنجاح! سنرد عليك قريباً.");
                contactForm.reset(); // تنظيف الخانات بعد الإرسال
            } catch (error) {
                alert("فشل الإرسال، حاول مرة أخرى.");
            }
        });
    </script>
</body>
</html>
